<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="820" height="480" fill="#f8fafc"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#111">New Sale</text>
  <!-- header fields -->
  <rect x="24" y="48" width="380" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="38" y="68" font-size="10" fill="#6b7280">Invoice number (auto)</text>
  <text x="38" y="90" font-size="13" fill="#111">INV-482193</text>
  <rect x="416" y="48" width="380" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="430" y="68" font-size="10" fill="#6b7280">Customer (search or type a new name)</text>
  <text x="430" y="90" font-size="13" fill="#111">Musa Hardware</text>
  <rect x="24" y="110" width="380" height="54" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="38" y="130" font-size="10" fill="#6b7280">Sell from (Home / Office)</text>
  <text x="38" y="152" font-size="13" fill="#111">POS-HOME — Home</text>
  <!-- items -->
  <rect x="24" y="176" width="772" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="38" y="198" font-size="12" font-weight="600" fill="#374151">Items</text>
  <rect x="38" y="210" width="330" height="30" rx="5" fill="#f1f5f9"/>
  <text x="50" y="230" font-size="12" fill="#111">Dangote Cement 50kg ▾</text>
  <rect x="378" y="210" width="90" height="30" rx="5" fill="#f1f5f9"/>
  <text x="392" y="230" font-size="12" fill="#111">Qty 10</text>
  <rect x="478" y="210" width="120" height="30" rx="5" fill="#f1f5f9"/>
  <text x="492" y="230" font-size="12" fill="#111">₦ 8,500</text>
  <text x="620" y="230" font-size="11" fill="#16a34a">100 in stock</text>
  <rect x="38" y="248" width="330" height="30" rx="5" fill="#fafafa" stroke="#eef2f7"/>
  <text x="50" y="268" font-size="12" fill="#9ca3af">Product… ▾</text>
  <text x="38" y="305" font-size="11" fill="#2563eb">+ Add line</text>
  <text x="640" y="305" font-size="11" fill="#2563eb">+ Item from another seller</text>
  <!-- totals -->
  <rect x="520" y="338" width="276" height="96" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="536" y="360" font-size="12" fill="#6b7280">Subtotal</text><text x="770" y="360" font-size="12" fill="#111" text-anchor="end">₦ 85,000</text>
  <text x="536" y="382" font-size="12" fill="#6b7280">Tax</text><text x="770" y="382" font-size="12" fill="#111" text-anchor="end">₦ 0</text>
  <line x1="536" y1="394" x2="780" y2="394" stroke="#e5e7eb"/>
  <text x="536" y="416" font-size="14" font-weight="700" fill="#111">Total</text><text x="770" y="416" font-size="14" font-weight="700" fill="#111" text-anchor="end">₦ 85,000</text>
  <!-- CTA -->
  <rect x="24" y="398" width="250" height="40" rx="8" fill="#111"/>
  <text x="149" y="423" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Record sale &amp; draw stock</text>
  <text x="24" y="462" font-size="11" fill="#2563eb">Stock is drawn oldest-batch-first and traced to the buyer.</text>
</svg>
