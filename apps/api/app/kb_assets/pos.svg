<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="700" height="420" fill="#f8fafc"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#111">POS Payments</text>
  <text x="24" y="54" font-size="11" fill="#6b7280">Card payments that still need linking to an invoice.</text>
  <!-- card -->
  <rect x="24" y="70" width="652" height="320" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="44" y="104" font-size="20" font-weight="700" fill="#111">₦ 85,000</text>
  <text x="656" y="98" font-size="10" fill="#6b7280" text-anchor="end">moniepoint · terminal P2948 · 10:31</text>
  <!-- flags -->
  <rect x="44" y="118" width="612" height="26" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="135" font-size="11" fill="#92400e">⚠ Possible duplicate of transaction #104 — same amount within 10 minutes.</text>
  <!-- suggestions -->
  <text x="44" y="168" font-size="10" font-weight="700" fill="#6b7280">LIKELY INVOICE</text>
  <rect x="44" y="176" width="612" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="58" y="197" font-size="12" fill="#111"><tspan font-weight="700">INV-482193</tspan> · Musa Hardware · bal ₦ 85,000</text>
  <text x="646" y="197" font-size="11" fill="#6b7280" text-anchor="end">92% match → assign</text>
  <rect x="44" y="214" width="612" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="58" y="235" font-size="12" fill="#111"><tspan font-weight="700">INV-482188</tspan> · Walk-in · bal ₦ 85,000</text>
  <text x="646" y="235" font-size="11" fill="#6b7280" text-anchor="end">61% match → assign</text>
  <!-- manual -->
  <rect x="44" y="300" width="110" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="99" y="320" font-size="11" fill="#9ca3af" text-anchor="middle">Invoice ID</text>
  <rect x="162" y="300" width="170" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="247" y="320" font-size="11" fill="#111" text-anchor="middle">Assign to this invoice</text>
  <rect x="566" y="300" width="90" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="611" y="320" font-size="11" fill="#6b7280" text-anchor="middle">Ignore</text>
  <text x="44" y="366" font-size="11" fill="#2563eb">Tip: charge from the invoice with “Charge on POS” and it links here automatically.</text>
</svg>
