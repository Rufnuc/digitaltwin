# ---------------------------------------------------------------------------
# DigitalTwin — local development stack
# Phase 1 brings up Postgres (required) and Redis (reserved for later phases).
# The API and web apps can be run on the host or containerised later.
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: digitaltwin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digitaltwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitaltwin}
      POSTGRES_DB: ${POSTGRES_DB:-digitaltwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digitaltwin} -d ${POSTGRES_DB:-digitaltwin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reserved for Phase 3+ background workers (simulation jobs, OCR pipeline).
  redis:
    image: redis:7-alpine
    container_name: digitaltwin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  db_data:
